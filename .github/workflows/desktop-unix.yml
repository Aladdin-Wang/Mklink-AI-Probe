name: macOS and Linux desktop packages
on:
  push:
    branches: [codex/0.3.2-fixes]
    paths:
      - '.github/workflows/desktop-unix.yml'
      - 'Mklink-AI-Probe/gui/src-tauri/**'
      - 'Mklink-AI-Probe/skills/tauri-gui-builder/**'
      - 'Mklink-AI-Probe/scripts/build_workspace.ps1'
      - 'Mklink-AI-Probe/mklink/remote/stcp.py'
      - 'Mklink-AI-Probe/mklink/usb*.py'
      - 'Mklink-AI-Probe/mklink/discovery.py'
      - 'Mklink-AI-Probe/mklink/serial/_port.py'
      - 'Mklink-AI-Probe/_maintainer/testing/desktop_unix_smoke.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-unix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: Mklink-AI-Probe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libusb-1.0-0-dev libudev-dev libfuse2 xvfb
      - name: Install macOS USB library
        if: runner.os == 'macOS'
        run: brew install libusb
      - name: Toolchain versions
        run: |
          rustup update stable --no-self-update
          rustc -Vv
          go version
          python --version
      - name: Install Python and locked GUI dependencies
        run: |
          ./scripts/build_workspace.ps1 -Action run -Executable python -ArgumentList @('-m', 'pip', 'install', '.[gui,mcp]', 'pyinstaller==6.18.0', 'pytest==8.4.2')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/build_workspace.ps1 -Action run -WorkingDirectory ./gui -Executable npm -ArgumentList @('ci')
      - name: Build native desktop installer
        run: ./scripts/build_workspace.ps1 -Action run -Executable python -ArgumentList @('skills/tauri-gui-builder/scripts/build_unix.py')
      - name: USB regression tests
        run: ./scripts/build_workspace.ps1 -Action run -Executable python -ArgumentList @('-m', 'pytest', '-q', '_maintainer/testing/tests/test_usb_interfaces.py', '_maintainer/testing/tests/test_usb_platform.py', '_maintainer/testing/tests/test_discovery.py')
      - name: Qualify frozen backend and installed package contents
        run: ./scripts/build_workspace.ps1 -Action run -Executable python -ArgumentList @('_maintainer/testing/desktop_unix_smoke.py', '${{ matrix.target }}')
      - name: Upload installers and qualification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mklink-v0.3.2-${{ matrix.target }}
          path: |
            .build/artifacts/${{ matrix.target }}
            .build/reports
          if-no-files-found: warn
          retention-days: 30
