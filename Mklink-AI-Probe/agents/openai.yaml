interface:
  display_name: "Mklink AI Probe"
  short_description: "Flash, RTT/VOFA, memory dump/write, serial, and Modbus debugging."
  default_prompt: "Use $mklink-ai-probe first for target symbols, variables, memory, registers, HardFault, RTT/VOFA, and firmware workflows. Default AXF/ELF parsing to bundled pyelftools; use pyOCD for read-only fallback only after MKLink reports a concrete read failure."

