      .startup-mark { fill:none; stroke:#f5ad91; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .startup-node { fill:#8394a9; }
      .startup-caption { text-align:center; margin:18px 0 0; font-size:11px; letter-spacing:.25em; color:#98a7ba; }
      .startup-footer { position:relative; width:min(320px,80vw); }
      .startup-heading { display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:20px; }
      .startup-brand { font-size:22px; font-weight:650; letter-spacing:-.6px; }
      .startup-brand small { font-size:12px; font-weight:400; color:#a8b4c4; letter-spacing:.02em; margin-left:8px; }
      #startup-progress-value { font:500 11px/1 Consolas,monospace; color:#ee9677; }
      .startup-progress { height:3px; overflow:hidden; background:#303947; border-radius:3px; }

  <body>
    <div id="app"></div>
    <div id="startup-splash" role="status" aria-live="polite">
      <div class="startup-visual" aria-hidden="true">
        <svg class="startup-circuit" viewBox="0 0 440 220">
          <path class="startup-track" d="M10 62h80l42 48h38M10 158h80l42-48h38M270 110h38l42-48h80M270 110h38l42 48h80"/>
          <path class="startup-signal" d="M10 62h80l42 48h38M270 110h38l42 48h80"/>
          <path class="startup-signal second" d="M10 158h80l42-48h38M270 110h38l42-48h80"/>
          <rect class="startup-halo" x="148" y="38" width="144" height="144" rx="36"/>
          <rect class="startup-core" x="166" y="56" width="108" height="108" rx="24"/>
          <path class="startup-mark" d="M189 92v36m23-36-23 18 23 18m17-36v36m23-36-23 18 23 18"/>
          <g class="startup-node"><circle cx="10" cy="62" r="3"/><circle cx="10" cy="158" r="3"/><circle cx="430" cy="62" r="3"/><circle cx="430" cy="158" r="3"/></g>
        </svg>
        <p class="startup-caption">CONNECT · DEBUG · CREATE</p>
      </div>
      <div class="startup-footer">
        <div class="startup-heading">
          <span class="startup-brand">MKLink<small>AI Probe</small></span>
          <span id="startup-progress-value">8%</span>
        </div>
        <div
          id="startup-progress"
          class="startup-progress"
          role="progressbar"
          aria-label="启动进度"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="8"
        >
          <div id="startup-progress-fill"></div>
        </div>
        <p id="startup-status">正在准备工作区…</p>
      </div>
    </div>
    <script>
      (() => {
        const splash = document.getElementById('startup-splash')
        const progress = document.getElementById('startup-progress')
        const fill = document.getElementById('startup-progress-fill')
        const valueLabel = document.getElementById('startup-progress-value')
        const status = document.getElementById('startup-status')
        let value = 8
        let timer = 0

        const update = (nextValue, nextStatus) => {
          value = Math.max(value, Math.min(100, Math.round(nextValue)))
          fill.style.width = `${value}%`
          valueLabel.textContent = `${value}%`
          progress.setAttribute('aria-valuenow', String(value))
          if (nextStatus) status.textContent = nextStatus
        }

        timer = window.setInterval(() => {
          if (value < 18) update(value + 1)
        }, 320)

        window.__MKLINK_STARTUP__ = {
          update,
          finish() {
            window.clearInterval(timer)
            update(100)
            splash.classList.add('is-complete')
            window.setTimeout(() => splash.remove(), 260)
          },
        }
      })()
    </script>

  </body>
